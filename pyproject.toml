[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sales_intelligence"
version = "1.0.0"
description = "AI-powered E-Commerce Sales Intelligence Platform"
authors = [{name = "Chetanay Batra"}]
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "google-genai>=0.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
sales-ai = "sales_intelligence.cli:main"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
